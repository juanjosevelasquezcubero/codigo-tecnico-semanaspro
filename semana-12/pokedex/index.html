<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main>
    <h1>Pokédex</h1>
    <p>Digite um nome e busque. A URL da API vocês descobrem.</p>

    <form id="formulario">
      <input id="nome" type="text" placeholder="Ex: pikachu" autocomplete="off">
      <button type="submit">Buscar</button>
    </form>

    <p id="status"></p>
    <img id="sprite" alt="">
    <p id="titulo"></p>
  </main>
</body>

</html>
